<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>홍금보 키우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{font-family:'Jua',system-ui,sans-serif;max-width:430px;margin:0 auto;padding:10px 12px 28px;background:linear-gradient(#ffe9c7,#ffd6e0);min-height:100vh;color:#3b2a20;-webkit-tap-highlight-color:transparent}
  header{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:18px;padding:8px 14px;box-shadow:0 4px 0 #f0b9a0}
  header h1{margin:0;font-size:20px;font-weight:400;color:#e85d75}
  #kg{font-size:34px;line-height:1}
  #kg small{font-size:14px;color:#a08070}
  .chips{display:flex;gap:6px;justify-content:center;margin:8px 0;flex-wrap:wrap}
  .chip{background:#fff;border-radius:999px;padding:3px 10px;font-size:14px;box-shadow:0 2px 0 #f0b9a0}

  #stage{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 5px 0 #d9907a;background:#fff3d6;aspect-ratio:360/280}
  #stage canvas{display:block;width:100%!important;height:auto!important}
  #bubble{position:absolute;top:8px;left:10px;right:10px;background:#fff;border:3px solid #3b2a20;border-radius:16px;padding:6px 10px;font-size:16px;z-index:5;text-align:center;animation:pop .25s}
  #bubble:empty{display:none}
  #bubble::after{content:'';position:absolute;bottom:-11px;left:50%;border:9px solid transparent;border-top-color:#3b2a20;border-bottom:0}
  @keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}
  .typo{text-decoration:underline wavy #e63946;text-underline-offset:3px;cursor:pointer}
  .typo-done s{color:#aaa}.typo-done b{color:#e63946;font-weight:400}
  #hint{position:absolute;bottom:6px;right:10px;font-size:12px;color:#c0392b;z-index:5;background:#fff8;border-radius:8px;padding:0 6px}
  .delta{position:absolute;left:18%;top:48%;font-size:26px;z-index:6;animation:up 1.4s forwards;pointer-events:none;-webkit-text-stroke:1px #fff}
  @keyframes up{from{transform:translateY(0);opacity:1}to{transform:translateY(-60px);opacity:0}}
  #pig{width:100%;display:block}

  .bars{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;margin:10px 2px 4px;font-size:14px}
  .bar{height:12px;background:#fff;border-radius:6px;overflow:hidden;box-shadow:inset 0 1px 2px #0002}
  .bar i{display:block;height:100%;border-radius:6px;transition:width .4s}
  #event{font-size:18px;margin:8px 0 2px;text-align:center;color:#c0392b}
  #msg{min-height:44px;background:#fff;border-radius:14px;padding:8px 10px;margin:6px 0 10px;line-height:1.45;font-size:15px;text-align:center}
  #btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  #btns.two{grid-template-columns:1fr 1fr}#btns.one{grid-template-columns:1fr}
  button{font-family:inherit;width:100%;padding:8px 4px 7px;font-size:15px;border:0;border-radius:14px;cursor:pointer;touch-action:manipulation;color:#3b2a20;background:#fff;box-shadow:0 4px 0 var(--c,#f0b9a0);transition:transform .08s}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--c,#f0b9a0)}
  button .e{display:block;font-size:26px;line-height:1.2}
  button small{display:block;font-size:11px;color:#9a7a6a;margin-top:1px}
  .food{--c:#ff8a65}.sport{--c:#66bb6a}.work{--c:#64b5f6}.etc{--c:#ba68c8}
</style>
</head>
<body>
<header><h1>🥋 홍금보 키우기</h1><div id="kg"></div></header>
<div class="chips"><span class="chip">🎯 50kg</span><span class="chip">📅 <span id="day"></span>일차</span><span class="chip">💰 <span id="money"></span>원</span><span class="chip">✏️ <span id="fixes"></span></span></div>
<div id="stage">
  <div id="bubble"></div>
  <div id="hint">✏️ 틀린 맞춤법을 눌러서 고쳐줘</div>
</div>
<div class="bars">💪 의지력<div class="bar"><i id="will" style="background:linear-gradient(90deg,#ff8a80,#e53935)"></i></div>
⚡ 체력<div class="bar"><i id="sta" style="background:linear-gradient(90deg,#80cbc4,#26a69a)"></i></div></div>
<div id="event"></div>
<div id="msg"></div>
<div id="btns"></div>
<script src="game.js"></script>
<script src="stage.js"></script>
<script>
const $ = id => document.getElementById(id);
let s = newGame(), phase = 'act';
const typoHtml = t => t.replace(/\{([^|]+)\|([^}]+)\}/g, '<u class="typo" data-r="$2">$1</u>');
const KIND = { buldak: 'food', drink: 'food', itaewon: 'food', salad: 'food', boxing: 'sport', running: 'sport', hiking: 'sport', dance: 'sport', conv: 'work', pcbang: 'work' };

// 맞춤법 고쳐주기: 틀린 말 탭 → 빨간펜 교정 + 의지력 +3
$('bubble').onclick = e => {
  const u = e.target.closest('.typo'); if (!u) return;
  u.outerHTML = `<span class="typo-done"><s>${u.textContent}</s> <b>${u.dataset.r}</b></span>`;
  s.fixes++; s.will = Math.min(100, s.will + 3); $('hint').style.display = 'none'; stats();
};

function stats() {
  $('kg').innerHTML = s.w.toFixed(1) + '<small>kg</small>';
  $('day').textContent = s.day;
  $('money').textContent = s.money.toLocaleString();
  $('fixes').textContent = s.fixes;
  $('will').style.width = s.will + '%';
  $('sta').style.width = s.sta + '%';
}

function delta(d) {
  if (Math.abs(d) < 0.05 || !$('stage')) return;
  const el = document.createElement('div'); el.className = 'delta';
  el.textContent = (d > 0 ? '+' : '') + d.toFixed(1) + 'kg'; el.style.color = d > 0 ? '#e53935' : '#26a69a';
  $('stage').append(el); setTimeout(() => el.remove(), 1500);
}

function render() {
  stats();
  $('bubble').innerHTML = typoHtml(s.say);
  $('msg').innerHTML = s.log.join('<br>') || '오늘은 뭘 할까?';
  $('event').textContent = '';
  const b = $('btns'); b.innerHTML = ''; b.className = '';
  const add = (label, sub, fn, cls = '') => {
    const e = document.createElement('button'); e.className = cls;
    const [emoji, ...rest] = label.split(' ');
    e.innerHTML = `<span class="e">${emoji}</span>${rest.join(' ')}` + (sub ? `<small>${sub}</small>` : '');
    e.onclick = fn; b.append(e);
  };
  const run = fn => { const w = s.w; fn(); render(); delta(s.w - w); };
  if (s.over) return end(add);
  Stage.show(s);
  if (phase === 'act') for (const id in ACTIONS) add(ACTIONS[id][0], ACTIONS[id][1], () => run(() => {
    act(s, id);
    phase = tempted(s) ? 'tempt' : 'act';
    if (phase === 'act' && !s.over) skipTemptation(s);
  }), KIND[id] || 'etc');
  else {
    b.className = 'two';
    $('event').textContent = '🌙 ' + s.tempt[0] + '!';
    $('bubble').innerHTML = typoHtml(s.tempt[1]);
    add('😤 참는다', '의지력 -20 (모자라면 실패)', () => run(() => { temptation(s, false); phase = 'act'; }), 'sport');
    add('😋 먹는다', '+체중', () => run(() => { temptation(s, true); phase = 'act'; }), 'food');
  }
}

function end(add) {
  $('btns').className = 'one';
  if (s.over === 'win') {
    s.anim = 'win'; Stage.show(s);
    $('bubble').innerHTML = typoHtml('해낸 나 너무 {뿌득해|뿌듯해}💗 이제 치킨 먹어도 {돼지|되지}?');
    $('msg').innerHTML = `<b>🎉 50kg 달성!</b><br>${s.day}일 만에 해냈다. 상위 5%의 의지력!<br>맞춤법 ${s.fixes}번 고쳐줌 · 책 읽기 실패 ${s.books}회`;
  } else {
    Stage.destroy();
    $('stage').innerHTML = '<img id="pig" src="img/pig.jpg" alt="돼지엔딩">';
    $('stage').style.aspectRatio = 'auto';
    $('msg').innerHTML = `<b>🐷 돼지엔딩</b><br>${s.day}일 만에 ${s.w.toFixed(0)}kg. 홍금보는 이제 쿵푸가 아니라 구르기를 한다.<br>`
      + `통장 ${s.money.toLocaleString()}원 · 맞춤법 ${s.fixes}번 고쳐줌 · 책 읽기 실패 ${s.books}회<br>(95%의 사람이 여기서 끝나요)`;
  }
  add('🔄 다시 도전', '', () => location.reload(), 'etc');
}
Stage.init($('stage')).then(render);
</script>
</body>
</html>
