<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>홍금보 키우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{font-family:'Jua',system-ui,sans-serif;max-width:430px;margin:0 auto;padding:0 12px;background:linear-gradient(#ffe9c7,#ffd6e0);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;color:#3b2a20;-webkit-tap-highlight-color:transparent}
  header{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:16px;padding:5px 12px;box-shadow:0 3px 0 #f0b9a0}
  header h1{margin:0;font-size:20px;font-weight:400;color:#e85d75}
  #kg{font-size:28px;line-height:1}
  #kg small{font-size:14px;color:#a08070}
  .chips{display:flex;gap:5px;justify-content:center;margin:6px 0;flex-wrap:wrap}
  .chip{background:#fff;border-radius:999px;padding:2px 9px;font-size:13px;box-shadow:0 2px 0 #f0b9a0}

  #stage{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 5px 0 #d9907a;background:#fff3d6;aspect-ratio:360/300}
  #stage canvas{display:block;width:100%!important;height:auto!important}
  #bubble{position:absolute;top:8px;left:10px;right:10px;background:#fff;border:3px solid #3b2a20;border-radius:16px;padding:6px 10px;font-size:16px;z-index:5;text-align:center;animation:pop .25s}
  #bubble:empty{display:none}
  #bubble::after{content:'';position:absolute;bottom:-11px;left:50%;border:9px solid transparent;border-top-color:#3b2a20;border-bottom:0}
  @keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}
  .typo{text-decoration:underline wavy #e63946;text-underline-offset:3px;cursor:pointer}
  .typo-done s{color:#aaa}.typo-done b{color:#e63946;font-weight:400}
  #hint{position:absolute;bottom:6px;right:10px;font-size:12px;color:#c0392b;z-index:5;background:#fff8;border-radius:8px;padding:0 6px}
  .delta{position:absolute;left:18%;top:48%;font-size:26px;z-index:6;animation:up 1.4s forwards;pointer-events:none;-webkit-text-stroke:1px #fff}
  @keyframes up{from{transform:translateY(0);opacity:1}to{transform:translateY(-60px);opacity:0}}
  #pig{width:100%;display:block}

  #top{flex:none;position:relative;z-index:10;background:#ffe9c7;margin:0 -12px;padding:8px 12px 6px;box-shadow:0 6px 10px -8px #0003}
  #scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;margin:0 -12px;padding:0 12px 24px}
  body.ended{height:auto;overflow:auto;display:block}body.ended #scroll{overflow:visible}
  .bars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 2px 0;font-size:14px}
  .bars>div{display:flex;align-items:center;gap:4px}.bars .bar{flex:1}
  .bar{height:12px;background:#fff;border-radius:6px;overflow:hidden;box-shadow:inset 0 1px 2px #0002}
  .bar i{display:block;height:100%;border-radius:6px;transition:width .4s}
  #event{font-size:18px;margin:8px 0 2px;text-align:center;color:#c0392b}
  #msg{min-height:44px;background:#fff;border-radius:14px;padding:8px 10px;margin:6px 0 10px;line-height:1.45;font-size:15px;text-align:center}
  #btns{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  #btns.two{grid-template-columns:1fr 1fr}#btns.one{grid-template-columns:1fr}
  button{font-family:inherit;width:100%;padding:6px 2px 5px;font-size:13.5px;border:0;border-radius:14px;cursor:pointer;touch-action:manipulation;color:#3b2a20;background:#fff;box-shadow:0 4px 0 var(--c,#f0b9a0);transition:transform .08s}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--c,#f0b9a0)}
  button .e{display:block;font-size:22px;line-height:1.2}
  button small{display:block;font-size:9.5px;color:#9a7a6a;margin-top:1px;letter-spacing:-.3px}
  #btns.two button{font-size:17px;padding:10px 4px}#btns.two button small{font-size:12px}
  #chat{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:5px 10px;margin-top:6px;min-height:38px;font-size:14px;box-shadow:0 2px 0 #f0b9a0;line-height:1.3}
  #chat.new{animation:slide .35s}
  #chat i{width:28px;height:28px;border-radius:50%;background:linear-gradient(45deg,#f9a825,#e91e63,#8e24aa);font-style:normal;display:grid;place-items:center;font-size:15px;flex:none}
  #chat b{font-weight:400;color:#8e24aa;margin-right:4px}
  #feed{position:absolute;left:8px;bottom:30px;display:flex;flex-direction:column;gap:4px;z-index:6;max-width:72%;pointer-events:none}
  .cmt{background:#fffe;border-radius:14px;padding:3px 10px 3px 3px;font-size:13px;display:flex;align-items:center;gap:6px;box-shadow:0 2px 6px #0002;animation:slide .3s,fade .5s 3.2s forwards}
  .cmt i{width:22px;height:22px;border-radius:50%;background:linear-gradient(45deg,#f9a825,#e91e63,#8e24aa);color:#fff;font-style:normal;display:grid;place-items:center;font-size:13px;flex:none}
  .cmt b{font-weight:400;color:#8e24aa}
  @keyframes slide{from{transform:translateX(-30px);opacity:0}}
  @keyframes fade{to{opacity:0}}
  /* 무대 안 이벤트 연출 (팝업 대신) */
  #ov{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;overflow:hidden;border-radius:18px;pointer-events:none}
  #ov.on{display:flex}
  #ov.alert{animation:flash .35s infinite alternate}
  @keyframes flash{from{box-shadow:inset 0 0 0 4px #e53935,inset 0 0 40px 10px #ff174455}to{box-shadow:inset 0 0 0 7px #ff8a80,inset 0 0 90px 30px #ff1744aa}}
  #ov.good::before{content:'';position:absolute;width:760px;height:760px;left:50%;top:50%;margin:-380px 0 0 -380px;background:repeating-conic-gradient(#ffd54f55 0 9deg,transparent 9deg 18deg);animation:spin 8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .tape{position:absolute;bottom:30px;left:-10%;right:-10%;transform:rotate(-4deg);background:repeating-linear-gradient(45deg,#ffd600 0 14px,#111 14px 28px);padding:5px 0;display:none;z-index:2}
  #ov.alert .tape,.tape.show{display:block}
  .tape span{display:block;white-space:nowrap;background:#111;color:#ffd600;font-size:15px;padding:2px 0;animation:marq 6s linear infinite}
  @keyframes marq{to{transform:translateX(-50%)}}
  .ban{position:relative;background:#fffffff2;border:3px solid #3b1f12;border-radius:18px;padding:8px 16px;max-width:86%;text-align:center;box-shadow:0 5px 0 #0003;animation:popin .5s cubic-bezier(.2,1.6,.4,1)}
  #ov.alert .ban{border-color:#e53935;animation:popin .5s cubic-bezier(.2,1.6,.4,1),shk .35s .5s 2}
  #ov.good .ban{border-color:#ffb300}
  @keyframes popin{from{transform:scale(.2) rotate(-8deg);opacity:0}}
  .ban .ic{font-size:40px;line-height:1.1}.ban .tt{font-size:22px}
  #ov.alert .tt{color:#e53935}#ov.good .tt{color:#f57f17}
  .ban .tx{font-size:14px;line-height:1.45}.ban .tx b{color:#e53935;font-weight:400}.ban .tx small{display:block;color:#aaa;font-size:11px;margin-top:2px}
  #btns.wait{opacity:.45;pointer-events:none}
  #btns.four{grid-template-columns:1fr 1fr}#btns.four button{font-size:15px;padding:9px 4px}
  .flash{position:absolute;inset:0;background:#fff;z-index:11;animation:flash2 .5s forwards;pointer-events:none}
  @keyframes flash2{from{opacity:1}to{opacity:0}}
  .snaptag{position:absolute;top:56px;left:10px;z-index:11;background:#3b1f12;color:#fff;border-radius:10px;padding:3px 8px;font-size:13px;animation:popin .4s cubic-bezier(.2,1.6,.4,1),fade .5s 2s forwards}
  .mirror{display:flex;gap:10px;margin:4px 0}.mirror>div{flex:1;border-radius:12px;padding:6px 4px;font-size:13px}
  .mirror>div:first-child{background:#ffe4ef}.mirror>div:last-child{background:#eee}.mirror big{display:block;font-size:30px;line-height:1.1}
  .bets{text-align:left;font-size:13.5px;line-height:1.55;margin-top:4px}
  .album{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .album figure{margin:0;background:#fff;padding:4px 4px 2px;border-radius:6px;box-shadow:0 2px 6px #0003;transform:rotate(var(--r))}
  .album img{width:100%;display:block;border-radius:3px}.album figcaption{font-size:10.5px;line-height:1.2;padding:2px 0}
  #kg.fake{color:#e85d75}#kg.err{font-size:15px;color:#c0392b}
  .shake{animation:shk .4s}
  @keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  #mute{background:none;border:0;font-size:20px;width:auto;box-shadow:none;padding:0 6px 0 0}
  .badges{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px}
  .badge{background:#fff3c4;border-radius:999px;padding:2px 8px;font-size:13px}
  .food{--c:#ff8a65}.sport{--c:#66bb6a}.work{--c:#64b5f6}.etc{--c:#ba68c8}
</style>
</head>
<body>
<div id="top">
<header><h1>🥋 홍금보 키우기</h1><div style="display:flex;align-items:center"><button id="mute"></button><div id="kg"></div></div></header>
<div class="chips"><span class="chip">🎯 50kg</span><span class="chip">📅 <span id="day"></span>일차</span><span class="chip">💰 <span id="money"></span>원</span><span class="chip">✏️ <span id="fixes"></span></span></div>
<div id="stage">
  <div id="bubble"></div>
  <div id="ov"><div class="tape"><span></span></div><div class="ban"><div class="ic"></div><div class="tt"></div><div class="tx"></div></div></div>
  <div id="hint">✏️ 틀린 맞춤법을 눌러서 고쳐줘</div>
</div>
<div id="chat"></div>
<div class="bars"><div>💪<div class="bar"><i id="will" style="background:linear-gradient(90deg,#ff8a80,#e53935)"></i></div></div>
<div>⚡<div class="bar"><i id="sta" style="background:linear-gradient(90deg,#80cbc4,#26a69a)"></i></div></div>
<div>🍔<div class="bar"><i id="hunger" style="background:linear-gradient(90deg,#ffe082,#ff9800)"></i></div></div></div>
</div>
<div id="scroll">
<div id="msg"></div>
<div id="btns"></div>
</div>
<script src="game.js"></script>
<script src="stage.js"></script>
<script src="sfx.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
let s = Object.assign(newGame(), { badges: [] }), busy = false, newBadges = [], album = [], bets = [], lastInterview = -99;
const typoHtml = t => t.replace(/\{([^|]+)\|([^}]+)\}/g, '<u class="typo" data-r="$2">$1</u>');
const KIND = { buldak: 'food', drink: 'food', itaewon: 'food', salad: 'food', boxing: 'sport', running: 'sport', hiking: 'sport', dance: 'sport', conv: 'work', pcbang: 'work' };

// 맞춤법 고쳐주기: 틀린 말 탭 → 빨간펜 교정 + 의지력 +3 (말풍선, 팝업 공통)
const fixTypo = e => {
  const u = e.target.closest('.typo'); if (!u) return;
  u.outerHTML = `<span class="typo-done"><s>${u.textContent}</s> <b>${u.dataset.r}</b></span>`;
  s.fixes++; s.will = Math.min(100, s.will + 3); if ($('hint')) $('hint').style.display = 'none'; stats(); Sfx.play('pop');
};
$('bubble').onclick = fixTypo;

function stats() {
  $('kg').innerHTML = s.w.toFixed(1) + '<small>kg</small>';
  $('day').textContent = s.day;
  $('money').textContent = s.money.toLocaleString();
  $('fixes').textContent = s.fixes;
  $('will').style.width = s.will + '%';
  $('sta').style.width = s.sta + '%';
  $('hunger').style.width = s.hunger + '%';
}

// 업적 (놀림 뱃지)
const BADGES = [
  ['📚 자칭 독서왕', s => s.books >= 5],
  ['🍜 불닭 중독', s => s.streak.id === 'buldak' && s.streak.n >= 3],
  ['🕺 이태원 주민', s => (s.cnt.itaewon || 0) >= 3],
  ['✏️ 국어 선생님 빙의', s => s.fixes >= 15],
  ['📅 내일의 아이콘', s => s.tomorrow >= 5],
  ['🤳 보정의 신', s => s.selfies >= 3],
  ['🌙 냉장고 털이범', s => s.raids >= 2],
  ['🍺 간 혹사', s => (s.cnt.drink || 0) + (s.cnt.itaewon || 0) >= 5],
  ['💸 텅장', s => s.money <= -100000],
  ['🥊 샌드백이 이김', s => (s.cnt.boxing || 0) >= 5 && s.w >= 75],
  ['🐷 돼지 예약', s => s.w >= 90],
];

// 이벤트 팝업 [종류, 아이콘, 제목, 내용, 경고테이프 문구]
const POPS = {
  skip: ['info', '🛋️', '운동 포기', '운동복까지 입고 소파에 누웠다.<br>헬스장은 오늘도 기다린다.'],
  awaken: ['good', '💥', '쿵푸 각성!!', '오늘따라 몸이 날아다닌다. <b>-4kg</b>'],
  binge: ['alert', '🍕', '폭식 반동 경보', '어제 굶은 반동으로 폭식했다. <b>+2kg</b>'],
  yoyo: ['alert', '🪀', '요요 경보', '빠졌던 살이 그대로 돌아왔다.'],
  faint: ['alert', '🚑', '체력 방전', '쓰러져서 배달만 시켰다. <b>+1kg</b>'],
  starve: ['alert', '🍔', '배고픔 폭발', '눈 떠보니 배달 음식 3개를 먹고 있었다. <b>+3kg</b>'],
  raid: ['alert', '🚨', '긴급 속보', '새벽 3시 냉장고 습격 사건 발생.<br>용의자: 홍금보 (입가에 양념 묻음) <b>+2kg</b>', '속보 BREAKING'],
  season: ['alert', '🍻', '연말 회식 시즌 돌입', '오늘부터 매일 <b>+3kg</b>.<br>빨리 끝내야 한다!'],
  danger: ['alert', '🐷', '돼지 임계점 돌파', '90kg 돌파.<br>체중계가 비명을 지르기 시작했다.', 'DANGER'],
};

// 무대 안 이벤트 연출: 빨간 깜빡임 + 경고 테이프 + 배너 (좋은 일은 금빛 광선 + 폭죽)
// 기본은 2.3초 뒤 자동으로 넘어가고 무대를 탭하면 바로 넘어감. hold 면 직접 지울 때까지 유지
function stageAlert({ kind, icon, title, text, tape = 'WARNING', hold = false, ms = 2300 }) {
  const ov = $('ov'); if (!ov) return Promise.resolve();
  ov.className = 'on ' + kind;
  ov.querySelector('.ic').textContent = icon; ov.querySelector('.tt').textContent = title;
  ov.querySelector('.tx').innerHTML = text + (hold ? '' : '<small>탭하면 넘어가요</small>');
  ov.querySelector('.tape span').textContent = `⚠ ${tape} `.repeat(16);
  const ban = ov.querySelector('.ban'); ban.style.animation = 'none'; void ban.offsetWidth; ban.style.animation = '';
  if (kind === 'alert') { Sfx.play('siren'); navigator.vibrate?.([120, 60, 120]); }
  else if (kind === 'good') {
    Sfx.play('fanfare');
    const r = $('stage').getBoundingClientRect();
    window.confetti?.({ particleCount: 120, spread: 80, origin: { y: (r.top + r.height / 2) / innerHeight }, zIndex: 60 });
  } else Sfx.play('pop');
  if (hold) { ov.style.pointerEvents = 'none'; return Promise.resolve(); }
  ov.style.pointerEvents = 'auto';
  return new Promise(done => {
    const fin = () => { clearTimeout(timer); ov.onclick = null; ov.className = ''; ov.style.pointerEvents = 'none'; done(); };
    const timer = setTimeout(fin, ms); ov.onclick = fin;
  });
}
const clearAlert = () => { if ($('ov')) $('ov').className = ''; };

async function events() {
  for (const e of s.events.splice(0)) { const [kind, icon, title, text, tape] = POPS[e]; await stageAlert({ kind, icon, title, text, tape }); }
  for (const b of newBadges.splice(0)) await stageAlert({ kind: 'good', icon: '🏅', title: '업적 달성', text: `<b>${b}</b>` });
}

// 행동 직후 연출: 효과음, 친구 댓글, 업적, 체중계 장난
// 친구 댓글: 무대 아래 줄에 다음 댓글 올 때까지 표시
function chat([who, text]) {
  const c = $('chat'); if (!c) return;
  c.innerHTML = `<i>${AV[who] || who[0]}</i><span><b>${who}</b>${text}</span>`;
  c.classList.remove('new'); void c.offsetWidth; c.classList.add('new');
}
const AV = { 치킨창민: '🍗', 소주래인: '🍶', 누들석민: '🍜', 양주서영: '🥃', 갈비겨레: '🙄', 관장님: '🥊', 지코치님: '🏋️' };
const SND = { eat: 'chomp', drink: 'gulp', club: 'beat', dance: 'beat', box: 'punch', conv: 'beep', pc: 'type', selfie: 'shutter', raid: 'chomp', run: 'step', hike: 'step', sad: 'growl', book: 'snore', rest: 'snore' };
function after() {
  Sfx.play(SND[s.anim]);
  if (s.w >= 85 && ['eat', 'raid', 'drink'].includes(s.anim)) setTimeout(() => Sfx.play('oink'), 450);
  if (s.w >= 90) Sfx.play('thud');
  if (s.comment) chat(s.comment);
  for (const [name, ok] of BADGES) if (!s.badges.includes(name) && ok(s)) { s.badges.push(name); newBadges.push(name); }
  if (s.over) return;
  const kg = $('kg'), back = ms => setTimeout(() => { kg.className = 'shake'; stats(); }, ms);
  if (s.anim === 'selfie') { kg.className = 'fake'; kg.innerHTML = '48.0<small>kg ✨</small>'; back(1600); }
  else if (s.w >= 90) { kg.className = 'err'; kg.textContent = '⚠️ 1인용 체중계입니다'; back(1300); }
}

// 🎲 친구들 내기판: 시작할 때 4명이 랜덤으로 걸고, 엔딩에서 판정
function makeBets() {
  const d = 15 + Math.floor(Math.random() * 8);
  const all = [
    ['소주래인', `금보 ${d}일 안에 100kg 찍는다 ㅋㅋ 소주 한 병 걸게`, s => s.over === 'pig' && s.day <= d],
    ['치킨창민', '치킨 걸고 돼지엔딩', s => s.over === 'pig'],
    ['지코치님', '회원님 이번엔 믿어요... 50kg 성공!', s => s.over === 'win'],
    ['갈비겨레', '금보 조용. 책 3번 펴고 다 실패한다', s => s.books >= 3],
    ['누들석민', '냉장고 습격 무조건 한 번은 함', s => s.raids >= 1],
    ['양주서영', '통장 마이너스 간다에 양주 한 병', s => s.money < 0],
    ['관장님', '체육관(복싱) 3번도 안 온다', s => (s.cnt.boxing || 0) < 3],
  ];
  // 소주래인·치킨창민·지코치님은 고정, 나머지 중 2명 랜덤
  return [...all.slice(0, 3), ...all.slice(3).sort(() => Math.random() - 0.5).slice(0, 2)];
}
const betLines = done => bets.map(([w, t, ok]) => `${done ? (ok(s) ? '✅' : '❌') : AV[w]} <b>${w}</b> ${t}`).join('<br>');

// 📸 소주래인의 박제: 굴욕 순간마다 무대를 찍어서 앨범에 모음 (최대 9장)
const SHAME = { skip: '운동복만 입고 소파행', raid: '새벽 3시 냉장고 앞', starve: '배달 음식 3개 동시 섭취', faint: '체력 방전 후 배달',
  binge: '단식 다음 날 폭식', danger: '90kg 돌파 기념사진', club: '이태원 막춤', selfie: '보정 전 원본', eat: '또 먹음 (85kg+)' };
async function snapShame() {
  if (album.length >= 9 || !$('stage')) return;
  let key = s.events.find(e => SHAME[e]);
  if (!key && ['club', 'selfie'].includes(s.anim) && Math.random() < 0.6) key = s.anim;
  if (!key && s.anim === 'eat' && s.w >= 85 && Math.random() < 0.3) key = 'eat';
  if (!key || album.filter(a => a.key === key).length >= 2) return; // 같은 굴욕은 2장까지
  const img = await Stage.snap(); if (!img) return;
  const c = document.createElement('canvas'); c.width = 300; c.height = 250; c.getContext('2d').drawImage(img, 0, 0, 300, 250);
  album.push({ key, src: c.toDataURL('image/jpeg', 0.75), cap: `D${s.day} ${SHAME[key]}` });
  Sfx.play('shutter');
  const f = document.createElement('div'); f.className = 'flash'; $('stage').append(f); setTimeout(() => f.remove(), 600);
  const tag = document.createElement('div'); tag.className = 'snaptag'; tag.textContent = '📸 소주래인이 단톡방에 박제함';
  $('stage').append(tag); setTimeout(() => tag.remove(), 2600);
  await sleep(700);
}

// 🎤 긴급 기자회견: 하루에 2.5kg 넘게 찐 날 15% 확률, 한 번 하면 6일 쉼 (어쩌다 한 번)
const EXCUSES = [
  ['💧 물만 먹어도 쪄요', '진짜 물만 {먹엇는대|먹었는데} ..', ['소주래인', '물이 소주였겠지 ㅋㅋㅋㅋ']],
  ['💪 이거 다 근육이에요', '근육이 {무거워서그럼|무거워서 그럼} 💗', ['관장님', '체육관 세 번 온 근육?']],
  ['⚖️ 체중계가 고장났쓰', '체중계가 {고장난거임|고장 난 거임} 진짜임', ['지코치님', '회원님 체중계만 세 번째예요. 대체 살 언제 빼요?']],
  ['🎈 부은 거예요', '어제 라면 먹어서 {부은거|부은 거} {뿐임니다|뿐입니다}', ['누들석민', '그 라면 내가 끓여줌 ㅋㅋ']],
];
function interview(gain) {
  lastInterview = s.day;
  stageAlert({ kind: 'info', icon: '🎤', title: '긴급 기자회견', text: `기자: 오늘 <b>+${gain.toFixed(1)}kg</b>.<br>살찐 이유를 말씀해주세요`, hold: true });
  Sfx.play('shutter');
  return new Promise(done => {
    const b = $('btns'); b.innerHTML = ''; b.className = 'four';
    EXCUSES.forEach(([label, say, rebut]) => b.append(btn(label, '', () => {
      clearAlert(); s.say = say; $('bubble').innerHTML = typoHtml(say); chat(rebut); Sfx.play('pop'); done();
    }, 'etc')));
  });
}

// 🪞 거울 보기: 하루 안 지나감, 하루 한 번. 금보 생각 vs 체중계 현실
let mirrorDay = 0;
const MIRROR_SAY = ['나너무귀여웡💗 (자기애충만모먼트)', '오늘 {붓기빠진듯|붓기 빠진 듯} 💗', '거울 속 나 너무 {뿌득해|뿌듯해}💗', '이 정도면 {48키로|48kg} 아님?'];
const MIRROR_FRIENDS = [['소주래인', '거울이 금보 보고 금 감 ㅋㅋㅋ'], ['갈비겨레', '금보 조용 금보 거울 그만 보세요'],
  ['지코치님', '회원님 거울 말고 체중계를 믿으세요. 대체 살 언제 빼요?'], ['치킨창민', '거울 속엔 치킨이 없어 ㅋㅋ'], ['양주서영', '필터 끄고 다시 봐']];
async function mirror() {
  if (busy || mirrorDay === s.day) return; busy = true; mirrorDay = s.day;
  $('btns').classList.add('wait');
  s.say = MIRROR_SAY[Math.floor(Math.random() * MIRROR_SAY.length)]; $('bubble').innerHTML = typoHtml(s.say); Sfx.play('pop');
  await stageAlert({ kind: 'info', icon: '🪞', title: '거울 vs 체중계', ms: 3500, text: `<div class="mirror">
    <div>💭 금보 생각<big>48kg</big>나너무귀여웡💗</div>
    <div>⚖️ 체중계<big>${s.w.toFixed(1)}kg</big>${s.w >= 90 ? '⚠️ 1인용입니다' : `차이 <b>${(s.w - 48).toFixed(1)}kg</b>`}</div></div>` });
  chat(MIRROR_FRIENDS[Math.floor(Math.random() * MIRROR_FRIENDS.length)]);
  busy = false; render();
}

// 결과 공유 카드 (1080x1350 이미지 → 공유 시트, 안 되면 다운로드)
async function shareCard() {
  await document.fonts.ready;
  const H = album.length ? 1860 : 1480;
  const c = document.createElement('canvas'); c.width = 1080; c.height = H;
  const x = c.getContext('2d'), pig = s.over === 'pig';
  const bg = x.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#ffe9c7'); bg.addColorStop(1, '#ffd6e0');
  x.fillStyle = bg; x.fillRect(0, 0, 1080, H);
  const img = await new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = pig ? 'img/pig.jpg' : 'img/face.png'; });
  x.save(); x.beginPath(); x.roundRect(90, 160, 900, 640, 40); x.fillStyle = '#fff'; x.fill(); x.clip();
  const k = pig ? Math.max(900 / img.width, 640 / img.height) : Math.min(900 / img.width, 600 / img.height);
  x.drawImage(img, 540 - img.width * k / 2, pig ? 160 : 180, img.width * k, img.height * k); x.restore();
  x.textAlign = 'center'; x.fillStyle = '#e85d75'; x.font = '64px Jua'; x.fillText('🥋 홍금보 키우기', 540, 110);
  x.fillStyle = '#3b2a20'; x.font = '70px Jua';
  x.fillText(pig ? `${s.day}일 만에 ${s.w.toFixed(0)}kg 달성 🐷` : `${s.day}일 만에 50kg 성공 🎉`, 540, 890);
  x.font = '42px Jua';
  [`"내일부터 다이어트" 선언 ${s.tomorrow}회`, `책 읽기 실패 ${s.books}회 · 셀카 보정 ${s.selfies}회`,
    `냉장고 습격 ${s.raids}회 · 맞춤법 ${s.fixes}개 교정당함`, `통장 ${s.money.toLocaleString()}원`].forEach((l, i) => x.fillText(l, 540, 970 + i * 58));
  x.font = '38px Jua'; x.fillStyle = '#8e24aa';
  for (let i = 0; i < s.badges.length; i += 3) x.fillText(s.badges.slice(i, i + 3).join('  '), 540, 1215 + (i / 3) * 48);
  const won = bets.filter(([, , ok]) => ok(s)).map(([w]) => w);
  x.fillStyle = '#3b2a20'; x.font = '40px Jua';
  x.fillText('🎲 내기 승자: ' + (won.length ? won.join(', ') : '없음'), 540, 1355);
  if (album.length) { // 박제 사진 최대 3장
    x.fillText('📸 소주래인의 박제 앨범', 540, 1430);
    const pics = await Promise.all(album.slice(0, 3).map(a => new Promise(r => { const i = new Image(); i.onload = () => r([i, a.cap]); i.src = a.src; })));
    pics.forEach(([im, cap], i) => {
      const px = 60 + i * 330, py = 1460;
      x.save(); x.translate(px + 150, py + 125); x.rotate((i - 1) * 0.04);
      x.fillStyle = '#fff'; x.fillRect(-160, -135, 320, 300); x.drawImage(im, -150, -125, 300, 250);
      x.fillStyle = '#3b2a20'; x.font = '24px Jua'; x.fillText(cap, 0, 150); x.restore();
    });
  }
  x.fillStyle = '#9a7a6a'; x.font = '34px Jua'; x.fillText('너도 키워봐 👉 ' + location.host + location.pathname, 540, H - 40);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const file = new File([blob], 'honggumbo.png', { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) return navigator.share({ files: [file], text: '홍금보 키우기 결과 🐷 ' + location.href }).catch(() => {});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'honggumbo.png'; a.click();
}
$('mute').textContent = Sfx.muted ? '🔇' : '🔊';
$('mute').onclick = () => { $('mute').textContent = Sfx.toggle() ? '🔇' : '🔊'; };

function delta(d) {
  if (Math.abs(d) < 0.05 || !$('stage')) return;
  const el = document.createElement('div'); el.className = 'delta';
  el.textContent = (d > 0 ? '+' : '') + d.toFixed(1) + 'kg'; el.style.color = d > 0 ? '#e53935' : '#26a69a';
  $('stage').append(el); setTimeout(() => el.remove(), 1500);
}
const show = w => { render(); delta(s.w - w); after(); };

// 하루 진행: 행동 → 무대 이벤트 → (저녁 유혹 선택 or 그냥 밤) → 밤 이벤트
async function day(id) {
  if (busy) return; busy = true;
  $('btns').classList.add('wait');
  try {
    const w0 = s.w; let w = s.w; act(s, id); show(w); $('btns').classList.add('wait');
    await sleep(800); // 행동 장면 감상 시간
    await snapShame(); await events();
    if (!s.over) {
      if (tempted(s)) { const eat = await temptChoice(); w = s.w; temptation(s, eat); }
      else { s.events = []; w = s.w; skipTemptation(s); }
      show(w); $('btns').classList.add('wait');
      await sleep(500); await snapShame(); await events();
      const gain = s.w - w0;
      if (!s.over && gain >= 2.5 && s.day - lastInterview >= 6 && Math.random() < 0.15) { await sleep(400); await interview(gain); await sleep(1200); }
    }
  } finally { busy = false; render(); }
}

const btn = (label, sub, fn, cls = '') => {
  const e = document.createElement('button'); e.className = cls;
  const [emoji, ...rest] = label.split(' ');
  e.innerHTML = `<span class="e">${emoji}</span>${rest.join(' ')}` + (sub ? `<small>${sub}</small>` : '');
  e.onclick = fn; return e;
};

// 저녁 유혹: 무대에 경보를 띄우고, 아래 버튼 자리를 참는다/먹는다로 바꿔서 선택받음
function temptChoice() {
  const [sit, line] = s.tempt, cost = resistCost(s);
  stageAlert({ kind: 'alert', tape: '유혹 경보', icon: [...sit][0], title: '유혹 경보!', text: sit.slice(sit.indexOf(' ') + 1), hold: true });
  $('bubble').innerHTML = typoHtml(line);
  return new Promise(done => {
    const b = $('btns'); b.innerHTML = ''; b.className = 'two';
    b.append(btn('😤 참는다', `의지력 -${cost}${s.hunger >= 70 ? ' (배고픔!)' : ''}`, () => { clearAlert(); done(false); }, 'sport'),
      btn('😋 먹는다', '+체중', () => { clearAlert(); done(true); }, 'food'));
  });
}

function render() {
  stats();
  if ($('bubble')) $('bubble').innerHTML = typoHtml(s.say); // 돼지엔딩 후엔 무대가 사진으로 바뀜
  $('msg').innerHTML = s.log.join('<br>') || '오늘은 뭘 할까?';
  const b = $('btns'); b.innerHTML = ''; b.className = '';
  const add = (...a) => b.append(btn(...a));
  if (s.over) return end(add);
  Stage.show(s);
  for (const id in ACTIONS) add(ACTIONS[id][0], ACTIONS[id][1], () => day(id), KIND[id] || 'etc');
  add('🪞 거울 보기', mirrorDay === s.day ? '오늘은 이미 봄' : '하루 안 지나감', mirror, 'etc');
}

function end(add) {
  $('btns').className = 'two';
  const badges = (s.badges.length ? `<div class="badges">${s.badges.map(b => `<span class="badge">${b}</span>`).join('')}</div>` : '')
    + `<div class="bets"><b>🎲 내기 결과</b><br>${betLines(true)}</div>`
    + (album.length ? `<div style="margin-top:8px"><b>📸 소주래인의 박제 앨범 (${album.length}장)</b></div><div class="album">${album.map((a, i) =>
      `<figure style="--r:${(i % 2 ? 1 : -1) * (1 + i % 3)}deg"><img src="${a.src}"><figcaption>${a.cap}</figcaption></figure>`).join('')}</div>` : '');
  const winners = bets.filter(([, , ok]) => ok(s));
  if (winners.length) chat([winners[0][0], `내기 이겼다 ㅋㅋㅋ 금보 ${winners[0][0] === '지코치님' ? '회원님 축하해요!' : '빨리 내놔'}`]);
  if (s.over === 'win') {
    s.anim = 'win'; Stage.show(s);
    $('bubble').innerHTML = typoHtml('해낸 나 너무 {뿌득해|뿌듯해}💗 이제 치킨 먹어도 {돼지|되지}?');
    $('msg').innerHTML = `<b>🎉 50kg 달성!</b><br>${s.day}일 만에 해냈다. 상위 35%의 의지력!<br>맞춤법 ${s.fixes}번 고쳐줌 · 책 읽기 실패 ${s.books}회` + badges;
    stageAlert({ kind: 'good', icon: '🏆', title: '다이어트 성공!!', text: `${s.day}일 만에 50kg 달성.<br>홍금보 인생 최초의 사건.` });
  } else {
    Stage.destroy();
    $('stage').innerHTML = '<img id="pig" src="img/pig.jpg" alt="돼지엔딩"><div class="tape show"><span>' + '⚠ GAME OVER '.repeat(16) + '</span></div>';
    $('stage').style.aspectRatio = 'auto';
    document.body.classList.add('ended'); // 엔딩 사진은 커서 화면 분할 해제
    $('msg').innerHTML = `<b>🐷 돼지엔딩</b><br>${s.day}일 만에 ${s.w.toFixed(0)}kg. 홍금보는 이제 쿵푸가 아니라 구르기를 한다.<br>`
      + `통장 ${s.money.toLocaleString()}원 · 맞춤법 ${s.fixes}번 고쳐줌 · 책 읽기 실패 ${s.books}회<br>"내일부터" 선언 ${s.tomorrow}회 · 냉장고 습격 ${s.raids}회` + badges;
    Sfx.play('fail'); setTimeout(() => Sfx.play('oink'), 1500);
  }
  add('📤 결과 공유', '단톡방에 박제', shareCard, 'food');
  add('🔄 다시 도전', '', () => location.reload(), 'etc');
}
chat(['지코치님', '회원님 오늘부터라고요? 대체 살 언제 빼요?']);
bets = makeBets();
s.log.push(`<div class="bets"><b>🎲 친구들 내기판</b><br>${betLines(false)}</div>`);
Stage.init($('stage')).then(render);
</script>
